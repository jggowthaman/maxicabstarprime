<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
      MaxiCabStar Prime | Maxicab Singapore & Airport Transfers
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Book a reliable maxicab in Singapore with MaxiCabStar Prime. Enjoy airport transfers, spacious vehicles, group transportation and comfortable private rides."
    />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://maxicabstarprime.com/"
    />

    <!-- Open Graph SEO -->
    <meta
      property="og:title"
      content="MaxiCabStar Prime | Maxicab Singapore"
    />

    <meta
      property="og:description"
      content="Reliable Singapore maxicab services, airport transfers and group transportation with MaxiCabStar Prime."
    />

    <meta
      property="og:url"
      content="https://maxicabstarprime.com/"
    />

    <meta property="og:type" content="website" />

    <meta
      property="og:site_name"
      content="MaxiCabStar Prime"
    />

    <!-- Twitter SEO -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="MaxiCabStar Prime | Maxicab Singapore"
    />

    <meta
      name="twitter:description"
      content="Book Singapore maxicab services, airport transfers and private group rides."
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./public/logo-light.png" />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
